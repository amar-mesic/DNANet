training:
  experiment_name: depr # e.g. "real_data-best_unet-use_scheduler-delta_-0.01"
  checkpoint_dir: "checkpoints/"
  log_neptune: true
  batch_size: 32
  num_epochs: 100
  steps_per_epoch:
  use_evaluation_metric: true
  save_best: true
  use_scheduler: true
  scheduler_type: "warmup_cosine"
  scheduler_gamma: 0.9
  min_lr: 0.0001
  early_stopping: true
  min_delta: 0.000              # set to -99999 for no early stopping
  patience: 20
  learning_rate: 0.01
  weight_decay: 0.0001
  tensorboard: false
  seed: 42